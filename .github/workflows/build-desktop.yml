name: Build Desktop Clients & Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: UniversalDownloader-Windows-x64.zip
          # 产物是 arm64（macos-latest runner 即 Apple Silicon），
          # 资产名必须如实反映架构，否则 Intel 用户会下载到跑不起来的包
          - os: macos-latest
            artifact_name: UniversalDownloader-macOS-arm64.zip
          - os: ubuntu-22.04
            artifact_name: UniversalDownloader-Linux-x86_64.tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev libappindicator3-dev ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt

      - name: Build Desktop Executable with PyInstaller
        run: |
          pyinstaller desktop.spec --clean --noconfirm

      - name: Package Artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/UniversalDownloader -DestinationPath dist/UniversalDownloader-Windows-x64.zip

      - name: Package Artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist && zip -r UniversalDownloader-macOS-arm64.zip UniversalDownloader.app

      - name: Package Artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist && tar -czvf UniversalDownloader-Linux-x86_64.tar.gz UniversalDownloader

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Create GitHub Release
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          body: |
            ## 下载

            | 平台 | 文件 | 说明 |
            | --- | --- | --- |
            | macOS | `UniversalDownloader-macOS-arm64.zip` | 仅 Apple Silicon（M 系列芯片） |
            | Windows | `UniversalDownloader-Windows-x64.zip` | x64 |
            | Linux | `UniversalDownloader-Linux-x86_64.tar.gz` | x86_64 |

            ## macOS 首次打开

            客户端使用临时签名（ad-hoc），未做 Apple 公证，首次打开会被 Gatekeeper 拦截。
            任选一种方式放行，只需做一次：

            1. **右键打开**：在「应用程序」里右键点击（或按住 Control 点击）`UniversalDownloader.app`
               → 选「打开」→ 弹窗里再点一次「打开」，之后双击即可正常启动
            2. **系统设置**：「系统设置 → 隐私与安全性」，在底部点击「仍要打开」
            3. **命令行**：`xattr -dr com.apple.quarantine /Applications/UniversalDownloader.app`

            系统要求 **macOS 12.0 及以上**，且必须是 **Apple Silicon**。
            详细说明见项目 README 的「桌面客户端（macOS）」章节。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
