# Universal Downloader · 威联通（QNAP）Container Station 专用
#
# 为什么单独给一份：威联通上挂载点必须写**绝对路径**。
# 相对路径（./config）在 Container Station 里会落到应用程序自己的目录，
# 位置随应用名变化、重建应用还会变 —— 用户以为挂上了，其实没有。
#
# ── 部署前只需改两处 ────────────────────────────────────────────────
# 1. 存储池编号：下面的 CACHEDEV2 要换成你自己的。
#    SSH 登录后执行 `ls /share` 就能看到，形如 CACHEDEV1_DATA / CACHEDEV2_DATA。
#    ⚠️ 这个编号会随存储池/卷的增删而变化（加块硬盘就可能从 2 变 3），
#       换过硬盘后 compose 会突然挂载失败，回来改这里即可。
#
# 2. PUID / PGID：两个数字，决定下载下来的文件属于谁。
#    不对的话，文件在 File Station 里会显示成别的用户、你删不掉也改不了。
#    查法（SSH）：
#        id              # 当前用户，看 uid= 和 gid=
#        ls -n /share/Webs/universal-downloader/downloads   # 看已有目录的属主数字
#
# ── 更稳的路径写法（可选）────────────────────────────────────────────
# 如果 `ls -l /share | grep <共享文件夹名>` 能看到软链，
# 就用 /share/<共享文件夹名>/... 代替 /share/CACHEDEVn_DATA/<共享文件夹名>/...，
# 这样存储池编号变了也不用改。
#
# ══════════════════════════════════════════════════════════════════
#  三条部署路线，按你的情况选一条（选路线 A 或 B 时记得删掉 build: 两行）
# ══════════════════════════════════════════════════════════════════
#
# 路线 A｜拉预构建镜像（最省事，NAS 上不用装任何构建环境）
#     image: ghcr.io/<你的用户名>/douyin-download:latest
#     并**删掉**下面的 build: 两行。
#     仓库的 GitHub Actions 会推 amd64 + arm64 多架构镜像。
#
# 路线 B｜在 Apple 芯片 Mac 上交叉构建 → 导出 tar → NAS 导入
#     （**Intel 架构的 NAS 推荐这条**，实测有效，见下方 platform 说明）
#     Mac 上执行：
#         docker compose build          # 本文件已写死 platform: linux/amd64
#         docker save -o universal-downloader-amd64.tar universal-downloader:latest
#     NAS 上执行：
#         Container Station → 镜像 → 导入（选那个 tar）
#         或 SSH：docker load -i /share/Webs/universal-downloader-amd64.tar
#     ⚠️ 导入镜像这条路**必须删掉下面的 build: 两行、只留 image:** ——
#        否则 compose 会尝试在 NAS 上就地重新构建，而 NAS 上没有源码 → 直接报错。
#
# 路线 C｜在 NAS 上就地构建（需要把整个源码放到 NAS 上，且 NAS 装了构建环境）
#     就是本文件的原样，`docker compose build` 即可。Intel 型号原生构建，最慢但不折腾。
#
services:
  universal-downloader:
    # ⚠️ 这一行是给**在 Apple 芯片 Mac 上构建**准备的，别删（除非你的 NAS 是 arm64）。
    #    M 系列 Mac 上不指定平台会构建出 arm64 镜像，导到 Intel NAS 上
    #    容器会以 `exec format error` 起不来；不加 --platform 的 docker save
    #    导出的就是那枚 arm64 镜像。
    #    反过来说：**如果你的 NAS 是 ARM 型号（如 TS-233 / TS-133），
    #    把 amd64 改成 arm64，或直接删掉这一行。**
    #    在 Intel NAS 上这一行等于没写，留着完全无害。
    platform: linux/amd64

    build:
      context: .
      dockerfile: Dockerfile
    image: universal-downloader:latest
    container_name: universal-downloader
    restart: unless-stopped
    ports:
      # ⚠️ 宿主机端口别用 8000/8080 —— 威联通自带服务与常见应用很容易占用，
      #    冲突时容器会起不来。这里用 8800，按需改。
      - "8800:8000"
    volumes:
      # 【必须挂载】设置与历史记录。少了它，升级镜像后历史记录和 SESSDATA 都会丢。
      - /share/CACHEDEV2_DATA/Webs/universal-downloader/config:/config
      # 【必须挂载】下载归档目录（想直接存到别的共享文件夹就改左边）。
      - /share/CACHEDEV2_DATA/Webs/universal-downloader/downloads:/downloads
    environment:
      - TZ=Asia/Shanghai
      - PUID=1000
      - PGID=1000
      # 界面里改过归档目录后，以界面里的值为准；这里是**默认值**。
      - DOWNLOAD_DIR=/downloads
      # 可选：B站 SESSDATA，解锁 1080P/4K
      # - SESSDATA=your_sessdata_here
      # 可选：解析 YouTube / Twitter 需要代理（填你局域网内的代理地址，
      #       不是 127.0.0.1 —— 容器里的 127.0.0.1 是容器自己）
      # - HTTP_PROXY=http://192.168.1.2:7890
      # - HTTPS_PROXY=http://192.168.1.2:7890
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
