services:
  douyin-downloader:
    build:
      context: .
      dockerfile: Dockerfile
    image: douyin-downloader:latest
    container_name: douyin-downloader
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
